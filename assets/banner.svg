<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a78bfa" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(0.8deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-0.8deg); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbPulse {
        0%, 100% { r: 3px; opacity: 0.6; }
        50% { r: 5px; opacity: 1; }
      }
      @keyframes shimmerBorder {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      .bg-pulse-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .bg-pulse-2 { animation: pulseGlow 10s ease-in-out infinite 2s; transform-origin: 950px 220px; }
      .float-pill-1 { animation: floatSlow1 6s ease-in-out infinite; }
      .float-pill-2 { animation: floatSlow2 7s ease-in-out infinite 1s; }
      .float-pill-3 { animation: floatSlow1 8s ease-in-out infinite 2s; }
      .float-pill-4 { animation: floatSlow2 6.5s ease-in-out infinite 0.5s; }
      .float-pill-5 { animation: floatSlow1 7.5s ease-in-out infinite 1.5s; }
      .stream-line { stroke-dasharray: 12, 180; animation: flowLine 12s linear infinite; }
      .pulsing-node { animation: orbPulse 3s ease-in-out infinite; }
      .border-shimmer { animation: shimmerBorder 4s ease-in-out infinite; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Meshes -->
  <rect width="600" height="340" rx="16" fill="url(#cyanGlow)" class="bg-pulse-1" />
  <rect x="600" width="600" height="340" rx="16" fill="url(#purpleGlow)" class="bg-pulse-2" />
  <circle cx="600" cy="170" r="300" fill="url(#blueGlow)" />

  <!-- Circuit Network & Data Flow Vectors (Subtle Background) -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 50 80 Q 200 40 400 90 T 750 60 T 1150 110" />
    <path d="M 80 280 Q 300 240 600 270 T 980 230 T 1120 280" />
    <path d="M 120 180 L 260 120 L 420 180 L 580 120 L 780 180 L 980 120 L 1100 180" stroke-dasharray="4,6" />
    
    <!-- Flowing Particles -->
    <path d="M 50 80 Q 200 40 400 90 T 750 60 T 1150 110" class="stream-line" stroke="#67e8f9" stroke-width="3" filter="url(#glowFilter)" />
    <path d="M 80 280 Q 300 240 600 270 T 980 230 T 1120 280" class="stream-line" stroke="#c084fc" stroke-width="3" filter="url(#glowFilter)" />
  </g>

  <!-- Network Nodes -->
  <g fill="#38bdf8">
    <circle cx="260" cy="120" r="3.5" class="pulsing-node" />
    <circle cx="420" cy="180" r="4" class="pulsing-node" />
    <circle cx="780" cy="180" r="4" class="pulsing-node" />
    <circle cx="980" cy="120" r="3.5" class="pulsing-node" />
  </g>

  <!-- Foreground Main Branding Content -->
  <g text-anchor="middle" class="font-sans">
    
    <!-- Category Tag / Top Badge -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.2" class="border-shimmer" />
      <text y="5" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="2">ENTERPRISE AI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="125" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Enterprise AI
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Foundation Models • Agent Orchestration • Scalable RAG • Governance &amp; MLOps
    </text>

    <text x="600" y="192" font-size="14" font-weight="400" fill="#94a3b8">
      Curated Production-Grade SaaS Platforms &amp; High-Performance Open-Source Frameworks
    </text>
  </g>

  <!-- Floating Dynamic Enterprise Tech Pills (Bottom Area, Non-Obtrusive) -->
  <g class="font-sans" font-size="12" font-weight="600">
    
    <!-- Pill 1: Hyperscalers & Models -->
    <g class="float-pill-1" transform="translate(70, 240)">
      <rect width="180" height="42" rx="21" fill="url(#pillGrad1)" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="24" cy="21" r="7" fill="#3b82f6" />
      <text x="42" y="26" fill="#e2e8f0">Foundation Models</text>
    </g>

    <!-- Pill 2: Agent Orchestration -->
    <g class="float-pill-2" transform="translate(280, 240)">
      <rect width="195" height="42" rx="21" fill="url(#pillGrad1)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="24" cy="21" r="7" fill="#8b5cf6" />
      <text x="42" y="26" fill="#e2e8f0">Agent Orchestration</text>
    </g>

    <!-- Pill 3: Enterprise RAG -->
    <g class="float-pill-3" transform="translate(505, 240)">
      <rect width="170" height="42" rx="21" fill="url(#pillGrad1)" stroke="#06b6d4" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="24" cy="21" r="7" fill="#06b6d4" />
      <text x="42" y="26" fill="#e2e8f0">Hybrid RAG &amp; Vector</text>
    </g>

    <!-- Pill 4: MLOps & Infra -->
    <g class="float-pill-4" transform="translate(705, 240)">
      <rect width="180" height="42" rx="21" fill="url(#pillGrad1)" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="24" cy="21" r="7" fill="#10b981" />
      <text x="42" y="26" fill="#e2e8f0">MLOps &amp; Serving</text>
    </g>

    <!-- Pill 5: AI Governance & Trust -->
    <g class="float-pill-5" transform="translate(915, 240)">
      <rect width="215" height="42" rx="21" fill="url(#pillGrad1)" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="24" cy="21" r="7" fill="#f59e0b" />
      <text x="42" y="26" fill="#e2e8f0">Governance &amp; Guardrails</text>
    </g>
  </g>

  <!-- Outer Sleek Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
</svg>
