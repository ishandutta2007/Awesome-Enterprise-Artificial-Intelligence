form:translateY(8px) rotate(-.8deg)}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes orbPulse{0%{r:3px;opacity:.6}50%{r:5px;opacity:1}}@keyframes shimmerBorder{0%{stroke-opacity:.3}50%{stroke-opacity:.8}}.bg-pulse-1{animation:pulseGlow 8s ease-in-out infinite;transform-origin:200px 100px}.bg-pulse-2{animation:pulseGlow 10s ease-in-out infinite 2s;transform-origin:950px 220px}.float-pill-1{animation:floatSlow1 6s ease-in-out infinite}.float-pill-2{animation:floatSlow2 7s ease-in-out infinite 1s}.float-pill-3{animation:floatSlow1 8s ease-in-out infinite 2s}.float-pill-4{animation:floatSlow2 6.5s ease-in-out infinite .5s}.float-pill-5{animation:floatSlow1 7.5s ease-in-out infinite 1.5s}.stream-line{stroke-dasharray:12,180;animation:flowLine 12s linear infinite}.pulsing-node{animation:orbPulse 3s ease-in-out infinite}.border-shimmer{animation:shimmerBorder 4s ease-in-out infinite}.font-sans{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}</style></defs><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><rect width="600" height="340" fill="url(#cyanGlow)" class="bg-pulse-1" rx="16"/><rect width="600" height="340" x="600" fill="url(#purpleGlow)" class="bg-pulse-2" rx="16"/><circle cx="600" cy="170" r="300" fill="url(#blueGlow)"/><g fill="none" stroke="#38bdf8" stroke-width="1.5" opacity=".25"><path d="M 50 80 Q 200 40 400 90 T 750 60 T 1150 110"/><path d="M 80 280 Q 300 240 600 270 T 980 230 T 1120 280"/><path stroke-dasharray="4 6" d="M 120 180 L 260 120 L 420 180 L 580 120 L 780 180 L 980 120 L 1100 180"/><path stroke="#67e8f9" stroke-width="3" d="M 50 80 Q 200 40 400 90 T 750 60 T 1150 110" class="stream-line" filter="url(#glowFilter)"/><path stroke="#c084fc" stroke-width="3" d="M 80 280 Q 300 240 600 270 T 980 230 T 1120 280" class="stream-line" filter="url(#glowFilter)"/></g><g fill="#38bdf8"><circle cx="260" cy="120" r="3.5" class="pulsing-node"/><circle cx="420" cy="180" r="4" c